# ============================================================================
# Pages CMS 配置（https://app.pagescms.org/）
# 文件名必须是 .pages.yml，放在仓库根目录；改完要提交（commit）后才会生效。
# 官方文档：https://pagescms.org/docs/configuration/
# ============================================================================

# 图片上传到哪里、写成什么链接
media:
  input: static/images # 上传的文件存进仓库的 static/images（Hugo 会把 static/ 原样发布）
  output: /images # 写进文章里的链接是 /images/xxx.png
  rename: safe # 上传时文件名转成小写短横线形式

content:
  # ---------------------------- 博客文章（集合） ----------------------------
  - name: posts
    label: 博客文章
    type: collection
    path: content/posts
    format: yaml-frontmatter # Hugo 用的就是 YAML front matter（--- 包裹）
    # 文件名模板：用"日期 + 时分秒"自动生成，每次保存都唯一，且不依赖 slug 字段，
    # 因此 slug 留空也不会出现 2026-10-11-.md 这种悬空文件名 / .md 隐藏文件报错。
    # 之前的坑：{primary}/{fields.slug} 经 slugify(strict) 中文会变空 → 退化成 ".md" 报错；
    # 现在用时间令牌兜底，扩展名恒为 md。
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    view:
      primary: title
      fields: [title, date, draft]
      sort: [date, title]
      search: [title, tags]
      default:
        sort: date
        order: desc
    operations:
      create: true
      rename: true
      delete: true
    fields:
      - name: title
        label: 文章标题
        type: string
        required: true

      - name: date
        label: 发布日期
        type: date
        required: true
        options:
          time: true # 带时间，Hugo 排序才准
          # 不要写时区占位符 xxx：那会写出 +00:00（UTC），
          # 但时间数字用的是你本机的钟点，等于把时间戳往后推了 8 小时，
          # 落在"未来"的文章 Hugo 默认不发布，首页就看不到。
          # 不写时区时，Hugo 按 hugo.toml 里的 timeZone = "Asia/Shanghai" 解释。
          format: "yyyy-MM-dd'T'HH:mm:ss"

      - name: draft
        label: 草稿（勾上就不发布）
        type: boolean
        default: false # 新建默认直接发布；想先存草稿再手动勾上

      # 说明：原先的"链接别名(slug)"字段已移除。
      # Pages CMS 没有"随机生成"令牌，slug 无法自动填充，每次都要手填很麻烦。
      # 现由 filename 模板 "{year}-{month}-{day}-{hour}{minute}{second}.md"
      # 在保存时自动生成唯一文件名，Hugo 网址即 /posts/2026-10-11-143025/，无需填写。
      # 若以后想给某篇设自定义英文网址，再单独加回 slug 字段即可。

      - name: summary
        label: 文章摘要
        type: text
        description: 显示在列表页和搜索结果里，一两句话即可

      - name: tags
        label: 标签
        type: string
        list: true

      - name: categories
        label: 分类
        type: string
        list: true

      - name: body
        label: 正文内容
        type: rich-text
        options:
          format: markdown # Hugo 渲染的是 Markdown，不要选 html
          switcher: true

  # ---------------------------- 关于页（单文件） ----------------------------
  - name: about
    label: 关于页面
    type: file
    path: content/about.md
    format: yaml-frontmatter
    operations:
      rename: false
      delete: false
    fields:
      - name: title
        label: 标题
        type: string
        required: true

      - name: summary
        label: 摘要
        type: text

      - name: body
        label: 正文内容
        type: rich-text
        options:
          format: markdown
          switcher: true
